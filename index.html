<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .score, .time {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px auto;
            max-width: 400px;
        }

        .hole {
            width: 100px;
            height: 100px;
            background: #8B4513;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .mole {
            width: 60px;
            height: 60px;
            background: #8B4513;
            border-radius: 50%;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s ease;
        }

        .mole.up {
            bottom: 20px;
        }

        .mole::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 20px;
            background: pink;
            border-radius: 50%;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 15px;
            font-size: 1.2em;
            color: #333;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 打地鼠游戏</h1>

        <div class="game-info">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="time">时间: <span id="time">30</span>秒</div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
        </div>

        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
        </div>

        <div class="message" id="message">点击"开始游戏"来开始!</div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let timeInterval;
        let isGameActive = false;
        let clickSound;

        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const messageDisplay = document.getElementById('message');

        // 初始化游戏
        function initGame() {
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            messageDisplay.textContent = '点击"开始游戏"来开始!';

            // 重置所有地鼠位置
            moles.forEach(mole => {
                mole.classList.remove('up');
            });
        }

        // 开始游戏
        function startGame() {
            if (isGameActive) return;

            isGameActive = true;
            initGame();
            messageDisplay.textContent = '游戏进行中...';

            // 开始游戏循环
            gameInterval = setInterval(showRandomMole, 1000);

            // 开始计时
            timeInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // 随机显示地鼠
        function showRandomMole() {
            if (!isGameActive) return;

            // 隐藏所有地鼠
            moles.forEach(mole => {
                mole.classList.remove('up');
            });

            // 随机选择一个洞显示地鼠
            const randomIndex = Math.floor(Math.random() * holes.length);
            const randomMole = moles[randomIndex];

            // 显示地鼠
            randomMole.classList.add('up');

            // 3秒后自动隐藏
            setTimeout(() => {
                randomMole.classList.remove('up');
            }, 3000);
        }

        // 点击地鼠
        function whackMole(event) {
            if (!isGameActive) return;

            const mole = event.target;

            // 检查是否点击了显示的地鼠
            if (mole.classList.contains('up')) {
                score++;
                scoreDisplay.textContent = score;
                mole.classList.remove('up');

                // 显示得分反馈
                const feedback = document.createElement('div');
                feedback.textContent = '+1';
                feedback.style.cssText = `
                    position: absolute;
                    top: 0;
                    left: 50%;
                    transform: translateX(-50%);
                    color: #4CAF50;
                    font-size: 2em;
                    font-weight: bold;
                    animation: fadeOut 1s ease-out;
                `;

                // 添加动画样式
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fadeOut {
                        0% { opacity: 1; transform: translateX(-50%) translateY(0); }
                        100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
                    }
                `;
                document.head.appendChild(style);

                mole.appendChild(feedback);
                setTimeout(() => feedback.remove(), 1000);
            }
        }

        // 结束游戏
        function endGame() {
            isGameActive = false;
            clearInterval(gameInterval);
            clearInterval(timeInterval);

            // 隐藏所有地鼠
            moles.forEach(mole => {
                mole.classList.remove('up');
            });

            // 显示游戏结束信息
            messageDisplay.textContent = `游戏结束! 最终得分: ${score}分`;

            // 显示重新开始提示
            setTimeout(() => {
                messageDisplay.textContent = `游戏结束! 最终得分: ${score}分。点击"开始游戏"再来一局!`;
            }, 1000);
        }

        // 添加点击事件监听器
        moles.forEach(mole => {
            mole.addEventListener('click', whackMole);
        });

        // 初始化游戏
        initGame();
    </script>
</body>
</html>
